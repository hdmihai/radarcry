# CRI Radar — weekly verification that every free source still answers.
#
# The project's premise is "public or free-account APIs only, no subscription of any kind". A premise
# has to be checkable, so this workflow makes one small call per provider and publishes the result.
# It is also the fastest way to learn that a provider started geo-blocking GitHub's runners, which
# otherwise shows up only as a quietly thinner scan.
#
# Verdicts (scripts/probe-sources.js): ok · benign (optional key absent) · limited (rate limit or a
# public node that will not serve a method to this address — a warning) · broken (an error). Sources
# that are not ok get a second pass after a pause, so one noisy call on a shared runner address does
# not fail the run. Only a broken source fails the workflow.
#
# The probe writes no state and publishes no snapshot.
name: Probe surse

on:
  schedule:
    - cron: '41 6 * * 1' # Monday mornings, UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Probe every free source
        id: probe
        continue-on-error: true # a broken provider is the finding, not a failed workflow
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          COINGECKO_DEMO_API_KEY: ${{ secrets.COINGECKO_DEMO_API_KEY }}
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
          NODEREAL_API_KEY: ${{ secrets.NODEREAL_API_KEY }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          CRYPTOQUANT_API_KEY: ${{ secrets.CRYPTOQUANT_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARKHAM_API_KEY: ${{ secrets.ARKHAM_API_KEY }}
        run: |
          # One pass over the providers: the table on stdout, the same report as JSON for the gate.
          node src/main.js probe --json-out probe.json | tee probe.txt || true
          {
            echo '### Verificarea surselor gratuite'
            echo ''
            echo '```'
            cat probe.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: probe-${{ github.run_id }}
          path: |
            probe.json
            probe.txt
          retention-days: 3 # the repository's maximum artifact retention

      - name: Fail only when a source is broken (limits and absent optional keys are warnings)
        run: |
          if [ ! -f probe.json ]; then
            echo "::error title=Probe::raportul probe.json lipsește — sonda nu a rulat"
            exit 1
          fi
          node src/main.js probe --gate probe.json
