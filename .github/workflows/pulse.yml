# CRI Radar — the 15-minute pulse.
#
# A full scan reads two aggregator universes, candles, holder lists, contract security, development
# and attention. Running that every 15 minutes would exhaust every free plan within a day. The facts
# that actually move inside 15 minutes are a small, cheap subset — price, 24-hour change, funding and
# open interest — and all of them come from keyless exchange endpoints plus one Coinalyze batch.
#
# So this workflow refreshes only those, recomputes only what depends on them (the Futures Radar
# positioning block and its grade, the squeeze watch), and republishes. Everything derived from the
# full scan keeps that scan's timestamp, so the dashboard shows plainly which numbers are minutes old
# and which are hours old.
#
# Cost per pulse: about eight keyless calls plus at most three Coinalyze batches. Nothing with a
# monthly quota is touched, so the pulse can never be the reason a free plan runs out.
name: Pulse

on:
  schedule:
    # Four times an hour, off the quarter marks for the same queueing reason as the full scan.
    # GitHub runs scheduled workflows on a best-effort basis: a skipped pulse is harmless, because
    # the next one republishes the same facts and the dashboard always states its own age.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read # to see whether a full scan is running before touching the shared state

concurrency:
  # Pulses queue behind pulses only, and never cancel one another mid-push (a newer *queued* pulse
  # still replaces an older queued one, which is the "stale pulse" rule we want).
  #
  # This group must not be shared with the full scan. Concurrency groups are repository-wide, and a
  # run arriving with `cancel-in-progress: true` cancels whatever is running in its group, from any
  # workflow. With a shared group, the :22 pulse cancelled every :17 full scan that was still running
  # — which is all of them, since a live scan takes ten minutes — so the research state could never
  # grow. Mutual exclusion with the scan is done explicitly below, in the direction that is safe:
  # the pulse yields, the scan never waits.
  group: cri-pulse
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      published: ${{ steps.done.outputs.published }}
    steps:
      - name: Yield to a full scan that is running or queued
        id: yield
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A scan rewrites the whole state branch and republishes the dashboard ten minutes later;
          # a pulse published in between would only be overwritten. If the check itself fails, the
          # pulse also yields: a missed pulse costs nothing, two writers on one branch cost a run.
          if ! active=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow scan-and-deploy.yml --limit 20 \
              --json status --jq '[.[] | select(.status != "completed")] | length'); then
            echo "::warning::Nu am putut verifica dacă rulează o scanare completă — pulsul cedează rândul."
            echo "go=false" >> "$GITHUB_OUTPUT"
          elif [ "${active:-0}" -gt 0 ]; then
            echo "::notice::O scanare completă rulează sau așteaptă — pulsul cedează rândul; următorul puls republică peste rezultatul ei."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.yield.outputs.go == 'true'

      - uses: actions/setup-node@v7
        if: steps.yield.outputs.go == 'true'
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Restore the published snapshot from the cri-state branch
        id: restore
        if: steps.yield.outputs.go == 'true'
        run: |
          mkdir -p .state data
          if git fetch --no-tags --depth=1 origin cri-state 2>/dev/null; then
            git archive --format=tar FETCH_HEAD | tar -x -C .state
          fi
          if [ -f .state/snapshot/latest.json ]; then
            cp .state/snapshot/latest.json data/latest.json
            # The whole-horizon table belongs to the last full scan; the site keeps serving it.
            cp .state/snapshot/universe.json data/universe.json 2>/dev/null || true
            echo "have_snapshot=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Nu există încă un snapshot publicat. Pulsul se oprește; rulează întâi „Scan & deploy”."
            echo "have_snapshot=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pulse (price, funding, open interest)
        if: steps.restore.outputs.have_snapshot == 'true'
        env:
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
        run: node src/main.js pulse --out data

      - name: Validate the published contract
        if: steps.restore.outputs.have_snapshot == 'true'
        run: node scripts/validate-snapshot.js data/latest.json

      - name: Store the refreshed snapshot back on the state branch
        if: steps.restore.outputs.have_snapshot == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p .state/snapshot
          cp data/latest.json .state/snapshot/latest.json
          cd .state
          rm -rf .git
          git init -q -b cri-state
          git add -A
          git -c user.name="cri-radar[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "pulse: run ${GITHUB_RUN_ID} ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/cri-state

      - name: Include the AI agent's report (cri-agent branch), when there is one
        if: steps.restore.outputs.have_snapshot == 'true'
        run: |
          if git fetch --no-tags --depth=1 origin cri-agent 2>/dev/null && git show FETCH_HEAD:report/agent.json > data/agent.json 2>/dev/null; then
            echo "Raportul agentului AI inclus în site."
          else
            rm -f data/agent.json
          fi

      - name: Build static site
        if: steps.restore.outputs.have_snapshot == 'true'
        run: node scripts/build-site.js

      - uses: actions/configure-pages@v6
        if: steps.restore.outputs.have_snapshot == 'true'

      - uses: actions/upload-pages-artifact@v5
        if: steps.restore.outputs.have_snapshot == 'true'
        with:
          path: dist

      - name: Mark the pulse as published
        id: done
        if: steps.restore.outputs.have_snapshot == 'true'
        run: echo "published=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: pulse
    # Only a pulse that actually built a site deploys one: a pulse that yielded or found no snapshot
    # has no artifact, and deploying nothing used to end in a (silenced) failure on every such run.
    if: needs.pulse.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true # a pulse that cannot deploy must not mark the schedule as broken
