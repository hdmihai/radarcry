# CRI Radar — full research scan + GitHub Pages deployment.
#
#  1. restores the research state (own history, holder snapshots, listings registry, cohort,
#     quota ledger, references) from the `cri-state` branch — a single-commit orphan branch,
#     force-pushed each run, so it never grows;
#  2. runs the full scan: top 1000 CoinGecko + CoinMarketCap, every venue, holder lists, contract
#     security, development and attention — all on public or free-account APIs;
#  3. validates the published contract against schema/latest.schema.json;
#  4. saves the new state and deploys the static dashboard to GitHub Pages.
#
# If the live scan fails (both aggregators down, say) the last valid snapshot is redeployed, so the
# dashboard degrades to "older data" rather than to a blank page.
#
# Every secret below is optional and free. A missing key makes its capability report UNKNOWN — which
# is not "negative" — or leaves the platform reachable through its own free web interface.
name: Scan & deploy

on:
  schedule:
    # Every four hours, deliberately off the top of the hour: scheduled workflows queue behind the
    # :00 rush, and a research scan that starts twenty minutes late has read a different market.
    - cron: '17 */4 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'live = date reale din API-uri gratuite; demo = piață simulată (nu atinge starea)'
        type: choice
        options: [live, demo]
        default: live
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'web/**'
      - 'config/**'
      - 'schema/**'
      - 'scripts/**'
      - '.github/workflows/scan-and-deploy.yml'

permissions:
  contents: write # push the cri-state branch
  pages: write
  id-token: write

concurrency:
  # Scans queue behind scans only. This group is deliberately not shared with the pulse: concurrency
  # groups are repository-wide, so a shared group let every 15-minute pulse cancel a running scan.
  # The pulse now checks for a running scan itself and yields (see pulse.yml).
  group: cri-scan
  cancel-in-progress: false # never kill a scan halfway through a state update

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'live' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false # zero runtime dependencies; nothing to cache

      - name: Syntax check + tests (zero dependencies, no install step, no network)
        run: npm run ci

      - name: Restore research state from the cri-state branch
        if: env.MODE == 'live'
        run: |
          mkdir -p .state
          if git fetch --no-tags --depth=1 origin cri-state 2>/dev/null; then
            git archive --format=tar FETCH_HEAD | tar -x -C .state
            echo "Stare restaurată: $(ls .state | tr '\n' ' ')"
          else
            echo "Prima rulare: nu există încă ramura cri-state. Normele proprii se construiesc de la"
            echo "aceasta rulare înainte; primele scanări vor raporta încredere scăzută, ceea ce este corect."
          fi

      - name: Full scan (live)
        if: env.MODE == 'live'
        env:
          # Aggregators — free keys, higher limits and a second independent universe.
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          COINGECKO_DEMO_API_KEY: ${{ secrets.COINGECKO_DEMO_API_KEY }}
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
          # Derivatives — free account, replaces CoinGlass whose API is paid.
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
          # Holder lists on EVM chains — NodeReal Free, 10M compute units a month.
          NODEREAL_API_KEY: ${{ secrets.NODEREAL_API_KEY }}
          # Cycle context on BTC/ETH — CryptoQuant Basic (market data only on the free plan).
          CRYPTOQUANT_API_KEY: ${{ secrets.CRYPTOQUANT_API_KEY }}
          # Attention — YouTube Data API, in place of X which has no free read tier.
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          # Development activity — the token Actions already provides is enough.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Entity intelligence — optional free trial; without it, labels come from eth-labels.
          ARKHAM_API_KEY: ${{ secrets.ARKHAM_API_KEY }}
          ARKHAM_API_BASE: ${{ secrets.ARKHAM_API_BASE }}
        run: |
          set +e
          node src/main.js scan --state .state --out data
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "::warning::Scanarea a eșuat (cod $code). Republic ultimul snapshot valid."
            if [ -f .state/snapshot/latest.json ]; then
              mkdir -p data && cp .state/snapshot/latest.json data/ && cp .state/snapshot/summary.json data/ 2>/dev/null || true
            else
              exit "$code"
            fi
          else
            mkdir -p .state/snapshot
            cp data/latest.json .state/snapshot/
            cp data/summary.json .state/snapshot/ 2>/dev/null || true
          fi

      - name: Scan (demo, simulated market)
        if: env.MODE == 'demo'
        run: node src/main.js scan --fixtures --simulate-days 30 --state .state-demo --out data

      - name: Validate the published contract
        run: node scripts/validate-snapshot.js data/latest.json

      - name: Save research state (single-commit orphan branch)
        if: env.MODE == 'live'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd .state
          rm -rf .git
          git init -q -b cri-state
          git add -A
          git -c user.name="cri-radar[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "state: run ${GITHUB_RUN_ID} ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/cri-state
          echo "Stare salvată: $(du -sh . | cut -f1)"

      - name: Build static site
        run: node scripts/build-site.js

      - name: Run summary
        run: node scripts/run-summary.js data/latest.json >> "$GITHUB_STEP_SUMMARY"

      - name: Check that GitHub Pages publishes from Actions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The research state is already saved at this point, so a failure here loses nothing —
          # but it must say exactly which setting to change, in the dashboard's language.
          if ! build_type=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type' 2>/dev/null); then
            echo "::error title=GitHub Pages nu este activat::Settings → Pages → Build and deployment → Source: GitHub Actions. Starea cercetării este deja salvată pe ramura cri-state; după activare, rulează din nou „Scan & deploy”."
            exit 1
          fi
          if [ "$build_type" != "workflow" ]; then
            echo "::error title=GitHub Pages publică dintr-o ramură::Settings → Pages → Source trebuie să fie „GitHub Actions” (acum: ${build_type})."
            exit 1
          fi
          echo "GitHub Pages publică din Actions."

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
